name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            name: alpine
            target: image-all
            meta-flavor: ""
            meta-tags: |
              type=match,pattern=(.*)-r,group=1
              type=ref,event=pr
              type=edge
          -
            name: debian
            target: image-debian-all
            meta-flavor: |
              latest=false
            meta-tags: |
              type=match,pattern=(.*)-r,group=1,suffix=-debian
              type=ref,event=pr,suffix=-debian
              type=edge,suffix=-debian
              type=raw,value=debian,enable=${{ startsWith(github.ref, 'refs/tags/') }}
    uses: docker/github-builder/.github/workflows/bake.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3 # v1.16.0
    permissions:
      contents: read # same as global permissions
      id-token: write # for signing attestation(s) with GitHub OIDC Token
      packages: write # required to push to GHCR
    with:
      setup-qemu: true
      target: ${{ matrix.target }}
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      set-meta-labels: true
      meta-flavor: ${{ matrix.meta-flavor }}
      meta-images: |
        crazymax/fail2ban
        ghcr.io/crazy-max/fail2ban
      meta-tags: ${{ matrix.meta-tags }}
      meta-labels: |
        org.opencontainers.image.title=Fail2ban
        org.opencontainers.image.description=Intrusion prevention software framework that protects computer servers from brute-force attacks
        org.opencontainers.image.vendor=CrazyMax
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
